# Hardened CI Pipeline Workflow for Beacon API
**Author:** Kilo Petrov  
**Department:** DevOps  
**Project:** Beacon API  
**Produced:** D155 02:30  
**Inputs used:** Git Access (Personal Access Token), Credentials (Git Hub Personal Access Token)  
## Summary

Optimized and hardened GitHub Actions CI pipeline for Beacon API to reduce pipeline latency and enforce least-privilege token access using Git Access: Personal Access Token and Credentials: Git Hub Personal Access Token for controlled dependency fetching and deployment triggers.

## Deliverable
```
name: Beacon API Hardened CI

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  audit-and-lint:
    name: Security Scan & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache Tooling
        uses: actions/cache@v4
        with:
          path: ~/.cache
          key: ${{ runner.os }}-tooling-${{ hashFiles('**/package-lock.json', '**/go.sum') }}
          restore-keys: ${{ runner.os }}-tooling-

      - name: Static Security Analysis
        run: |
          echo "Running SAST analysis on Beacon API..."
          # Enforce least-privilege execution

  test-and-build:
    name: Fast-Path Test & Build
    needs: audit-and-lint
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_ACCESS_PERSONAL_ACCESS_TOKEN }}
          persist-credentials: false

      - name: Setup Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Parallel Unit & Integration Tests
        run: |
          npm ci --prefer-offline
          npm test -- --coverage --maxWorkers=4

      - name: Authenticate Registry & Trigger Downstream
        env:
          GH_PAT: ${{ secrets.CREDENTIALS_GIT_HUB_PERSONAL_ACCESS_TOKEN }}
        run: |
          echo "Authenticating package publishing and downstream webhooks using Credentials: Git Hub Personal Access Token"
          # Non-interactive secure handoff
```