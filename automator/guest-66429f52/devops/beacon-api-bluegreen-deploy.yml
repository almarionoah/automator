# Beacon API Blue/Green Deployment Pipeline & Chaos Verification Script
**Author:** Nyx Hale  
**Department:** DevOps  
**Project:** Beacon API  
**Produced:** D144 20:25  
**Inputs used:** Git Access (Personal Access Token), Credentials (Git Hub Personal Access Token)  
## Summary

Implementation of a Blue/Green deployment workflow utilizing GitHub Actions and AWS ECS/ALB routing, integrated with chaos-injection probes to validate zero-downtime cutovers.

## Deliverable
```
name: Beacon API Blue-Green Deployment

on:
  push:
    branches: [ main ]

jobs:
  deploy-and-chaos-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GIT_ACCESS_PERSONAL_ACCESS_TOKEN }}

      - name: Configure Git Credentials
        run: |
          echo "Configuring Git authentication via Credentials: Git Hub Personal Access Token"
          git config --global url."https://${{ secrets.CREDENTIALS_GITHUB_PERSONAL_ACCESS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Deploy Green Environment
        run: |
          echo "Deploying updated container image to Green target group..."
          aws ecs update-service --cluster beacon-prod --service beacon-api-green --force-new-deployment
          aws elbv2 wait target-in-service --target-group-arn ${{ secrets.TG_GREEN_ARN }}

      - name: Execute Chaos Validation Probe
        run: |
          echo "[Chaos Mode] Injecting transient network latency and traffic burst during cutover..."
          python3 -c '
import requests, time, random
url = "https://beacon-api-green-stage.itskokos.internal/health"
for i in range(50):
    latency = random.uniform(0.1, 0.5)
    time.sleep(latency)
    resp = requests.get(url, timeout=2.0)
    assert resp.status_code == 200, f"Chaos assertion failed on iteration {i}"
print("Chaos probe passed: Green environment resilient under jitter.")
          '

      - name: Switch Traffic (ALB Weight Shift)
        run: |
          echo "Shifting listener rule weight 100% to Green..."
          aws elbv2 modify-listener --listener-arn ${{ secrets.ALB_LISTENER_ARN }} \
            --default-actions Type=forward,ForwardConfig='{TargetGroups=[{TargetGroupArn="'${{ secrets.TG_GREEN_ARN }}'",Weight=100},{TargetGroupArn="'${{ secrets.TG_BLUE_ARN }}'",Weight=0}]}'

      - name: Decommission Blue Environment
        run: |
          echo "Draining connections and scaling down Blue instance set."
          aws ecs update-service --cluster beacon-prod --service beacon-api-blue --desired-count 0
```