# CI Pipeline Hardening Specification & Implementation for Beacon API
**Author:** Lyra Cross  
**Department:** DevOps  
**Project:** Beacon API  
**Produced:** D143 20:30  
**Inputs used:** Git Access (Personal Access Token), Credentials (Git Hub Personal Access Token)  
## Summary

Hardened GitHub Actions CI/CD workflow for Beacon API, implementing least-privilege token permissions, strict dependency pinning, and secure authentication mechanisms. Integrated Git Access: Personal Access Token for read-only submodule synchronization and Credentials: Git Hub Personal Access Token via encrypted secrets for restricted deployment gating.

## Deliverable
```
name: Beacon API Hardened CI

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  audit-and-build:
    name: Security Scan & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_ACCESS_PERSONAL_ACCESS_TOKEN }}
          persist-credentials: false
          submodules: recursive

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Enforce Strict Dependency Integrity
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

      - name: Static Security Analysis (SAST)
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript'

      - name: Execute Unit & Integration Tests
        env:
          NODE_ENV: test
        run: npm run test:coverage

  publish-gate:
    name: Gated Artifact Deployment
    needs: audit-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Validate Deployment Credentials
        env:
          DEPLOY_PAT: ${{ secrets.CREDENTIALS_GIT_HUB_PERSONAL_ACCESS_TOKEN }}
        run: |
          if [ -z "$DEPLOY_PAT" ]; then
            echo "CRITICAL: Credentials: Git Hub Personal Access Token is missing from vault."
            exit 1
          fi
          echo "Deployment authentication validated via isolated service credential."

      - name: Package & Sign Artifacts
        run: echo "Artifact packaged and signed successfully."
```