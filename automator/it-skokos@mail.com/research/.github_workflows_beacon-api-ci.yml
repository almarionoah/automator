# Beacon API: Git PAT Authentication & CI/CD Workflow Setup
**Author:** Full-Stack Web Developer  
**Department:** Research  
**Project:** Beacon API  
**Produced:** D1 17:35  
**Inputs used:** Git Access (Github Personal Access Token)  
## Summary

Integrated the 'Git Access: Github Personal Access Token' resource into the Beacon API CI/CD pipeline to enable authenticated multi-repository dependencies and secure checkout following clean code and least-privilege standards.

## Deliverable
```
# Beacon API CI/CD Pipeline
# Project: Beacon API (I.T. Skokos SaaS Platform)
# Authentication: Configured with resource 'Git Access: Github Personal Access Token'

name: Beacon API Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-validate:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          # 'Git Access: Github Personal Access Token' is mapped from organization secrets
          # to permit secure sub-module resolution and authenticated API package access.
          token: ${{ secrets.GITHUB_PAT }}
          fetch-depth: 1
          submodules: recursive

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Verify Git Authentication
        run: |
          git config --global url."https://${{ secrets.GITHUB_PAT }}@github.com/".insteadOf "https://github.com/"
          git status --short

      - name: Install Clean Dependencies
        run: npm ci

      - name: Code Quality & Static Analysis
        run: |
          npm run lint:strict
          npm run format:check

      - name: Execute Test Suite
        run: npm run test:coverage
        env:
          NODE_ENV: test
          CI: true

      - name: Build Distribution Bundle
        run: npm run build

```