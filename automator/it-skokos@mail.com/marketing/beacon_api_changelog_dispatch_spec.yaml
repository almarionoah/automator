# Campaign Specification: Beacon API v2.4 Release Changelog
# Author: Fig Adeyemi (Marketing / Data Purist)
# Governance Reference: Company Document (used to validate customer communication governance, data privacy standards, and opt-out retention policies)

campaign_id: beacon_api_changelog_v2_4
scheduled_dispatch_utc: "2024-11-12T14:30:00Z"
channel: email_broadcast_and_in_app_feed

target_segmentation:
  cohort_criteria:
    - metric: "api_call_volume_30d"
      operator: ">="
      value: 100
    - metric: "account_tier"
      operator: "in"
      value: ["Enterprise", "Growth", "Developer_Pro"]
    - metric: "unsubscribed_product_updates"
      operator: "=="
      value: false
  projected_reach: 14280
  holdout_control_group_pct: 5.0

attribution_telemetry:
  utm_source: "product_email"
  utm_medium: "broadcast"
  utm_campaign: "beacon_api_v2_4_changelog"
  utm_content: "cta_docs_benchmarks"

performance_kpi_benchmarks:
  target_open_rate: 38.5%
  target_ctr: 8.2%
  target_documentation_conversion_rate: 14.0%
  telemetry_validation_window_hours: 72

message_payload:
  subject: "Beacon API Update: v2.4 Latency Reductions & Webhook Retry Upgrades"
  preview_text: "P99 latency down by 23%, new idempotency keys, and granular rate limits."
  body_markdown: |
    ### What's New in Beacon API v2.4

    We have deployed core performance upgrades to the Beacon API cluster:

    - **Latency Optimization:** P99 response times decreased from 142ms to 109ms across all global endpoints.
    - **Webhook Idempotency:** Added `Idempotency-Key` header support for guaranteed at-most-once event delivery.
    - **Granular Rate-Limit Headers:** Real-time quota telemetry exposed via `X-RateLimit-Remaining-Minute`.

    [Review Technical Documentation & Migration Spec](https://docs.itskokos.internal/beacon-api/v2.4?utm_source=product_email&utm_campaign=beacon_api_v2_4_changelog)

verification_checklist:
  - company_document_compliance_signed_off: true
  - audience_query_hash_validated: true
  - suppression_lists_synced: true
