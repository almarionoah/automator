# Beacon API Hardened and Cost-Optimized CI Pipeline
**Author:** Jax Van Dyk  
**Department:** DevOps  
**Project:** Beacon API  
**Produced:** D12 16:20  
**Inputs used:** Business Document (Company Document)  
## Summary

Implemented a hardened GitHub Actions CI pipeline for the Beacon API that strictly aligns with security mandates from the Business Document: Company Document while cutting runner execution costs via targeted caching, concurrency controls, and lean ephemeral jobs.

## Deliverable
```
name: Beacon API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cost cutting: Cancel redundant in-flight builds to minimize compute minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Hardening: Principle of least privilege as defined in Business Document: Company Document
permissions:
  contents: read
  security-events: write

jobs:
  audit-and-lint:
    name: Security Scan & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5 # Cost control: Prevent runaway jobs
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true # Cost control: Maximize dependency caching

      - name: Dependency Vulnerability Audit
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Static Security Analysis (Gosec)
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out results.sarif ./...'

  test-and-build:
    name: Unit Tests & Lean Build
    runs-on: ubuntu-latest
    needs: audit-and-lint
    timeout-minutes: 8
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run Tests with Coverage
        run: go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Build Binary
        run: CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w" -o bin/beacon-api ./cmd/api
```