# Beacon API - Hardened CI/CD Pipeline Configuration
**Author:** Byte Reyes  
**Department:** DevOps  
**Project:** Beacon API  
**Produced:** D17 15:10  
**Inputs used:** Business Document (Company Document)  
## Summary

Hardened GitHub Actions CI/CD pipeline configuration for Beacon API, implementing least-privilege token permissions, automated SAST, container vulnerability scanning, and SBOM generation in accordance with specifications outlined in the Company Document.

## Deliverable
```
name: Beacon API Hardened CI

# Standardized per specifications outlined in Business Document: Company Document
# Applies least privilege, dependency vulnerability gating, and signed image outputs.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: read-all

jobs:
  audit-and-lint:
    name: Static Analysis & Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Audit Dependencies (per Company Document policy)
        run: npm audit --audit-level=high

      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
        env:
          SEMGREP_RULES: p/ci

  test-and-build:
    name: Test & Container Hardening
    needs: audit-and-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Run Unit Tests
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Image for Scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: beacon-api:ci-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'beacon-api:ci-scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
```