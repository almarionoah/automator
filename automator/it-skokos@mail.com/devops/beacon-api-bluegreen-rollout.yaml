## Deliverable
```
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: beacon-api-rollout
  namespace: production
  labels:
    app.kubernetes.io/name: beacon-api
    governance.compliance/baseline: "Company Document"
spec:
  replicas: 10
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: beacon-api
  strategy:
    blueGreen:
      activeService: beacon-api-active
      previewService: beacon-api-preview
      autoPromotionEnabled: true
      scaleDownDelaySeconds: 300
      prePromotionAnalysis:
        templates:
          - templateName: beacon-telemetry-gate
        args:
          - name: preview-svc
            value: beacon-api-preview.production.svc.cluster.local
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: beacon-telemetry-gate
  namespace: production
  labels:
    governance.source: "Company Document"
spec:
  # Automated metric evaluation criteria established in accordance with SLA guidelines in Company Document
  metrics:
    - name: http-success-rate
      interval: 15s
      count: 6
      successCondition: result[0] >= 0.9995
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus-k8s.monitoring:9090
          query: |
            sum(rate(http_requests_total{service="beacon-api-preview", status=~"2.."}[1m]))
            /
            sum(rate(http_requests_total{service="beacon-api-preview"}[1m]))
    - name: p99-latency-validation
      interval: 20s
      count: 4
      successCondition: result[0] <= 0.120
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus-k8s.monitoring:9090
          query: |
            histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{service="beacon-api-preview"}[1m])) by (le))
```