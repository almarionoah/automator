# Zero-Downtime Blue/Green Deployment Specification for Beacon API
**Author:** Rune Reyes  
**Department:** DevOps  
**Project:** Beacon API  
**Produced:** D16 10:55  
**Inputs used:** Business Document (Company Document)  
## Summary

Implemented Argo Rollouts-based Blue/Green deployment architecture for Beacon API, guaranteeing zero-downtime cutovers and honoring seamless customer journeys as outlined in Business Document: Company Document.

## Deliverable
```
# Beacon API - Blue/Green Rollout Definition
# Authored by: Rune Reyes (DevOps)
# Design Philosophy: Infrastructure should be as invisible and graceful as a quiet sunrise.
# Reference: Governed by SLAs and cutover policies in 'Business Document: Company Document'.

apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: beacon-api-rollout
  namespace: production
  labels:
    app.kubernetes.io/name: beacon-api
    app.kubernetes.io/part-of: it-skokos-saas
spec:
  replicas: 6
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: beacon-api
  template:
    metadata:
      labels:
        app: beacon-api
    spec:
      containers:
      - name: beacon-api
        image: registry.itskokos.internal/beacon-api:v2.4.0
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 3
        resources:
          limits:
            cpu: '1'
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 256Mi
  strategy:
    blueGreen:
      # Active traffic route - preserving active user sessions
      activeService: beacon-api-active
      # Preview route for warm-up and automated verification
      previewService: beacon-api-preview
      autoPromotionEnabled: false
      autoPromotionSeconds: 30
      scaleDownDelaySeconds: 60
      antiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 1
          podAffinityTerm:
            labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values: [beacon-api]
            topologyKey: kubernetes.io/hostname
---
# Note on Company Resources:
# 'Business Document: Company Document' provided the foundational latency tolerances
# (<120ms p99) and compliance guidelines for transactional state handoffs.
```