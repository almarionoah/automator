# Beacon API Blue/Green Deployment & Chaos Injection Suite
**Author:** Kilo Bishop  
**Department:** DevOps  
**Project:** Beacon API  
**Produced:** D13 08:25  
**Inputs used:** Business Document (Company Document)  
## Summary

Production Blue/Green deployment configuration and automated chaos validation script for Beacon API, designed to stress-test routing switchovers under synthetic failure conditions in accordance with Business Document: Company Document.

## Deliverable
```
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: beacon-api-rollout
  namespace: production
  labels:
    app: beacon-api
    managed-by: kilo-bishop
spec:
  replicas: 10
  strategy:
    blueGreen:
      activeService: beacon-api-active
      previewService: beacon-api-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 120
      prePromotionAnalysis:
        templates:
          - templateName: chaos-switchover-assessment
  template:
    metadata:
      labels:
        app: beacon-api
    spec:
      containers:
        - name: beacon-api
          image: registry.itskokos.internal/beacon-api:v2.4.0
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 3
---
# Chaos Verification Hook Execution
# Governed by resilience targets defined in Business Document: Company Document
# Company Document provided the SLA error budget limits (<0.01% drop) and 30s rollback thresholds.
apiVersion: batch/v1
kind: Job
metadata:
  name: beacon-chaos-pre-promotion
spec:
  template:
    spec:
      containers:
      - name: chaos-monkey
        image: chaosmesh/chaos-daemon:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "[CHAOS] Running disruption suite on beacon-api-preview...";
            # Inject 150ms latency & random 15% packet loss on preview
            chaos-cli network delay --service beacon-api-preview --latency 150ms --duration 45s &
            # Simulate random pod termination during 50/50 weighted warm-up
            chaos-cli pod kill --selector app=beacon-api,role=preview --count 2 &
            # Run HTTP load assertions against SLA thresholds from Company Document
            k6 run --thresholds 'http_req_failed<0.001' load-test-preview.js;
      restartPolicy: Never
```