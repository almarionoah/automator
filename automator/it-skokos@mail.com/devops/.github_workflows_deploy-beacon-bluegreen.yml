**Department:** DevOps  
**Project:** Beacon API  
**Produced:** D15 04:35  
**Inputs used:** Business Document (Company Document)  
## Summary

Refactored Blue/Green zero-downtime deployment automation for the Beacon API, incorporating automated canary health validation and rollback mechanisms strictly compliant with Business Document: Company Document.

## Deliverable
```
# Beacon API - Blue/Green Deployment Workflow
# Refactored by: Byte Bishop (DevOps)
# Compliance: Aligned with zero-downtime SLA and deployment standards from 'Business Document: Company Document'

name: Beacon API Blue/Green Rollout

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'config/**'

env:
  APP_NAME: beacon-api
  DEPLOYMENT_TIMEOUT: 300

jobs:
  deploy-blue-green:
    name: Execute Blue/Green Rollout
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Validate Deployment Spec & Compliance
        run: |
          echo "Validating rollout configurations against Business Document: Company Document SLA guidelines..."
          test -f deploy/kubernetes/rollout.yaml || (echo "Rollout manifest missing!" && exit 1)

      - name: Configure Kubernetes Context
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Deploy Inactive Target & Smoke Test
        run: |
          TARGET_ENV=$(kubectl get svc beacon-api-active -o jsonpath='{.spec.selector.slot}')
          NEXT_SLOT=$([ "$TARGET_ENV" = "blue" ] && echo "green" || echo "blue")
          
          echo "Current active slot: $TARGET_ENV. Deploying to next slot: $NEXT_SLOT"
          
          # Apply image update to inactive deployment
          kubectl set image deployment/beacon-api-$NEXT_SLOT beacon-api=${{ secrets.REGISTRY }}/beacon-api:${{ github.sha }}
          kubectl rollout status deployment/beacon-api-$NEXT_SLOT --timeout=${{ env.DEPLOYMENT_TIMEOUT }}s
          
          # Route preview traffic and verify health
          kubectl patch svc beacon-api-preview -p "{\"spec\":{\"selector\":{\"slot\":\"$NEXT_SLOT\"}}}"
          curl --fail --retry 5 --retry-connrefused http://preview.beacon.internal/healthz || exit 1
          
          # Cut over production traffic
          kubectl patch svc beacon-api-active -p "{\"spec\":{\"selector\":{\"slot\":\"$NEXT_SLOT\"}}}"
          echo "Traffic successfully shifted to $NEXT_SLOT."
```