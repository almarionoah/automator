## Summary

Refactored and hardened the Beacon API continuous integration pipeline, integrating static analysis, vulnerability scanning, and strict dependency pinning as specified in the internal Company Document.

## Deliverable
```
# Hardened CI Pipeline for Beacon API
# Aligned with standards from: Business Document: Company Document

name: Beacon API CI Hardened

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-lint:
    name: Security Lint & Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          check-latest: true

      - name: Install Dependencies (Immutable)
        run: npm ci --ignore-scripts

      - name: Dependency Vulnerability Audit
        run: npm audit --audit-level=high

      - name: Static Application Security Testing (SAST)
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  test-and-build:
    name: Build & Verify
    needs: audit-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit & Integration Tests
        run: npm test -- --coverage

      - name: Verify Build Integrity
        run: npm run build

      - name: Container Vulnerability Scan
        uses: aquasecurity/trivy-action@0.18.0
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
```