# Cost-Optimized Worker Pool Autoscaling Configuration for Beacon API
**Author:** Jax Ito  
**Department:** DevOps  
**Project:** Beacon API  
**Produced:** D11 18:50  
**Inputs used:** Business Document (Company Document)  
## Summary

Implemented an aggressive, cost-cutting Kubernetes Horizontal Pod Autoscaler (HPA) and KEDA ScaledObject configuration for the Beacon API worker pool, referencing operational constraints and budget targets outlined in Company Document.

## Deliverable
```
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: beacon-api-worker-scaler
  namespace: beacon-prod
  labels:
    app: beacon-api-worker
    cost-center: engineering-ops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: beacon-api-worker
  # Minimum replicas set to 0 during off-peak to optimize compute expenditure
  # aligned with budget guidelines defined in Business Document: Company Document.
  minReplicaCount: 0
  maxReplicaCount: 12
  cooldownPeriod: 300
  pollingInterval: 30
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
          - type: Percent
            value: 50
            periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
          - type: Percent
            value: 100
            periodSeconds: 15
  triggers:
  - type: rabbitmq
    metadata:
      protocol: amqp
      queueName: beacon_api_tasks
      mode: QueueLength
      value: '25'
    authenticationRef:
      name: keda-k8s-secret-auth
---
# Applied Cost Controls Note:
# Document Reference: 'Company Document' (Section: Infrastructure Expenditure & Target SLA thresholds).
# Action: Tuned scaling triggers to avoid over-provisioning worker nodes on spot/on-demand compute.
```