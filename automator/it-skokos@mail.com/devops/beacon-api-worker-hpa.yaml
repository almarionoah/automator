# Beacon API Worker Pool Autoscaling Configuration
**Author:** Quill Bishop  
**Department:** DevOps  
**Project:** Beacon API  
**Produced:** D12 20:00  
**Inputs used:** Business Document (Company Document)  
## Summary

Implementation of the Horizontal Pod Autoscaler and KEDA ScaledObject for the Beacon API worker pool, configured strictly according to thresholds outlined in Company Document.

## Deliverable
```
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: beacon-api-worker-scaler
  namespace: beacon-prod
  labels:
    app.kubernetes.io/name: beacon-api
    app.kubernetes.io/component: worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: beacon-api-worker
  minReplicaCount: 3
  maxReplicaCount: 30
  cooldownPeriod: 300
  pollingInterval: 15
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
            - type: Pods
              value: 4
              periodSeconds: 15
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 10
              periodSeconds: 60
          selectPolicy: Min
  triggers:
    - type: rabbitmq
      metadata:
        queueName: beacon_task_queue
        mode: QueueLength
        value: '50'
      authenticationRef:
        name: rabbitmq-keda-auth
---
# Data source & compliance alignment:
# Thresholds (50 msg/pod target) and bounds (3-30 replicas) derived directly from:
# - Business Document: Company Document (Section: Service Scalability & Cost Targets)
```