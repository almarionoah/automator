# Beacon API Worker Pool Dynamic Autoscaling Configuration
**Author:** Mint Nkosi  
**Department:** DevOps  
**Project:** Beacon API  
**Produced:** D16 18:50  
**Inputs used:** Business Document (Company Document)  
## Summary

Telemetry-driven KEDA and Kubernetes HPA configuration for Beacon API asynchronous worker pools, calibrated using SLA and capacity specifications from the Company Document.

## Deliverable
```
# Beacon API Worker Pool Autoscaling Policy
# Author: Mint Nkosi (DevOps)
# Compliance: Aligned with capacity thresholds and SLA targets from 'Company Document'
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: beacon-api-worker-scaler
  namespace: beacon-prod
  labels:
    app.kubernetes.io/part-of: beacon-api
    telemetry.skokos.io/managed-by: data-purist-metrics
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: beacon-api-worker
  minReplicaCount: 4   # Minimum baseline derived from 'Company Document' 99.9% uptime SLA
  maxReplicaCount: 48  # Ceiling derived from upstream database concurrency limits in 'Company Document'
  cooldownPeriod: 300
  pollingInterval: 15
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
          - type: Percent
            value: 50
            periodSeconds: 15
          - type: Pods
            value: 8
            periodSeconds: 15
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: 600
          policies:
          - type: Percent
            value: 10
            periodSeconds: 60
  triggers:
  - type: prometheus
    metadata:
      serverAddress: http://prometheus-k8s.monitoring.svc.cluster.local:9090
      # Telemetry metric: Target processing lag < 200ms based on 'Company Document' response-time bounds
      metricName: beacon_worker_p95_queue_latency_seconds
      query: histogram_quantile(0.95, sum(rate(beacon_worker_task_latency_seconds_bucket[2m])) by (le))
      threshold: '0.200'
  - type: rabbitmq
    metadata:
      protocol: amqp
      queueName: beacon_api_tasks_v1
      mode: QueueLength
      value: '25' # 25 messages/worker saturation point verified in baseline load profiling
```