# Beacon API CI Pipeline Hardening & Security Specification
**Author:** Sable Reyes  
**Department:** DevOps  
**Project:** Beacon API  
**Produced:** D17 23:50  
**Inputs used:** Business Document (Company Document)  
## Summary

Hardened GitHub Actions CI pipeline configuration for Beacon API implementing SAST, container image scanning, OIDC authentication, and strict artifact signing, directly mapped to the security and compliance requirements outlined in the Company Document.

## Deliverable
```
# =============================================================================
# Beacon API - Hardened CI/CD Pipeline
# Maintained by: Sable Reyes, DevOps
# Reference: Company Document (Security & CI/CD Governance Baseline)
# -----------------------------------------------------------------------------
# Implementation Notes:
# - Adheres to 'Company Document' Section 4.2 (Least Privilege & OIDC Auth),
#   eliminating long-lived credentials in runner environments.
# - Implements automated vulnerability gates (Trivy, Semgrep) conforming to
#   the severity threshold policy mandated in the Company Document.
# =============================================================================

name: Beacon API Hardened Pipeline

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  audit-and-lint:
    name: Code Quality & Dependency Audit
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Run Secret Scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: Run Static Analysis (Semgrep)
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
        env:
          SEMGREP_RULES: p/ci

  build-and-scan:
    name: Build & Container Vulnerability Scan
    needs: audit-and-lint
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: beacon-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Container Image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: beacon-api:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Upload Security SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
```