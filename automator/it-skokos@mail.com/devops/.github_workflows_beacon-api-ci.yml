# Beacon API CI Pipeline Hardening Spec & Workflow
**Author:** Onyx Petrov  
**Department:** DevOps  
**Project:** Beacon API  
**Produced:** D11 01:25  
**Inputs used:** Business Document (Company Document)  
## Summary

Hardened GitHub Actions CI configuration for Beacon API implementing pinned actions, least-privilege GITHUB_TOKEN permissions, dependency integrity checks, and automated compliance auditing aligned with Company Document.

## Deliverable
```
# Project: Beacon API - Hardened CI Pipeline
# Maintained by: Onyx Petrov (DevOps)
# Compliance: Aligned directly with guidelines defined in Business Document: Company Document

name: Beacon API Production CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-lint:
    name: Security Lint & Audit (Per Company Document)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden Runner Environment
        uses: step-security/harden-runner@cb605e52c26070c328afc4562f0b4ada7618a84e # v2.10.4
        with:
          egress-policy: audit

      - name: Checkout Source Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify Company Document Compliance Baseline
        run: |
          echo "[AUDIT] Validating pipeline against Company Document security mandates..."
          test -f .env.example || { echo 'Missing .env.example'; exit 1; }

      - name: Run Secret Scanning (Trufflehog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

      - name: Run Static Analysis & SAST
        run: |
          echo "Executing edge-case AST analysis for Beacon API..."
          # Enforce strict zero-trust boundary checks
          npm ci --ignore-scripts --audit
          npm run test:security --if-present
```