# Hardened CI Pipeline Configuration for Beacon API
**Author:** Volt Marlow  
**Department:** DevOps  
**Project:** Beacon API  
**Produced:** D17 07:45  
**Inputs used:** Business Document (Company Document)  
## Summary

Security-hardened CI/CD pipeline configuration for Beacon API implementing SAST, dependency auditing, and strict least-privilege permissions in accordance with the specifications in Company Document.

## Deliverable
```
name: Beacon API Hardened CI

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

# Enforce least-privilege token permissions per Company Document standards
permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  audit-and-lint:
    name: Security Baseline & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Dependency Security Audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit --desc on

      - name: SAST Code Analysis (Bandit)
        run: |
          python -m pip install bandit
          bandit -r ./src -f json -o bandit-results.json || true

      - name: Upload Security Findings
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: bandit-results.json

  build-and-test:
    name: Build and Secure Unit Testing
    needs: audit-and-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Execute Test Suite with Coverage Validation
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pytest --cov=src --cov-fail-under=85 tests/

# Hardening references: Applied data-sanitization and pipeline policy verified against Company Document.
```