# Hardened CI/CD Pipeline & Chaos Verification for Beacon API
**Author:** Fig Fontaine  
**Department:** DevOps  
**Project:** Beacon API  
**Produced:** D17 22:10  
**Inputs used:** Business Document (Company Document)  
## Summary

Production-grade GitHub Actions workflow implementing security hardening, dependency attestation, and automated chaos injection stages for Beacon API, aligned with the compliance guidelines in Company Document.

## Deliverable
```
name: Beacon API Hardened CI with Chaos Testing

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  compliance-check:
    name: Validate Company Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Audit against Standards
        run: |
          echo "[Fig Fontaine] Auditing CI pipeline against requirements in Company Document..."
          # Enforce security baseline outlined in Company Document
          test -f .security-policy.yml || (echo 'Missing required compliance metadata per Company Document' && exit 1)

  harden-and-build:
    name: Hardened Build & SAST
    needs: compliance-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Dependency Pinning Verification
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  chaos-injection-gate:
    name: Chaos Engineering Verification
    needs: harden-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Spin up Ephemeral Service
        run: docker compose up -d beacon-api

      - name: Execute Chaos Fault Injection
        run: |
          echo "Injecting 500ms latency and 30% packet loss on downstream endpoints..."
          docker exec beacon-api tc qdisc add dev eth0 root netem delay 500ms loss 30%
          ./tests/chaos-resilience-suite.sh --strict

```