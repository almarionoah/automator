# Hardened CI/CD Pipeline Implementation for Beacon API
**Author:** Byte Petrov  
**Department:** DevOps  
**Project:** Beacon API  
**Produced:** D16 20:45  
**Inputs used:** Business Document (Company Document)  
## Summary

Hardened GitHub Actions pipeline configuration and security documentation for the Beacon API service, directly adhering to baseline security compliance specified in the Company Document.

## Deliverable
```
# =========================================================================
# Project: Beacon API - Hardened CI Pipeline
# Author: Byte Petrov, DevOps (I.T. Skokos)
# Reference: Compliance baselines aligned with 'Company Document' (Business Document).
# Application: Utilized 'Company Document' to enforce organizational SAST,
# container scanning, dependency audits, and least-privilege token policies.
# =========================================================================

name: Hardened Beacon API CI

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  audit-and-lint:
    name: Security Auditing & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go / Runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Dependency Vulnerability Audit
        run: |
          # Standard dependency scanning per Company Document compliance
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Static Application Security Testing (SAST)
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec.sarif ./...'

      - name: Upload SAST results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec.sarif

  build-and-verify:
    name: Build & Container Signature Verification
    needs: audit-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Binary (Hardened Compiler Flags)
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/beacon-api ./cmd/beacon-api

      - name: Trivy Container Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
```