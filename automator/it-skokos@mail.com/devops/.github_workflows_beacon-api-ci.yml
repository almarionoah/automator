# Beacon API Hardened CI Pipeline Configuration
**Author:** Sable Ito  
**Department:** DevOps  
**Project:** Beacon API  
**Produced:** D13 03:55  
**Inputs used:** Business Document (Company Document)  
## Summary

Hardened GitHub Actions CI/CD workflow for Beacon API implementing least-privilege permissions, automated SAST/SCA security scans, artifact signing, and strict step execution controls aligned with Company Document specifications.

## Deliverable
```
name: Beacon API CI Hardened Pipeline

# Reference: Company Document (Section 4.2 - Secure SDLC and CI/CD Baselines)
# Applied baseline controls: strict GITHUB_TOKEN permissions, dependency pinning, and mandatory SAST/SCA.

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-lint:
    name: Audit & Static Analysis
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4.1.7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5.0.1
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      - name: Dependency Vulnerability Scan (Govulncheck)
        uses: golang/govulncheck-action@v1.0.3
        with:
          go-version-file: 'go.mod'

      - name: Run Gosec SAST
        uses: securego/gosec@v2.20.0
        with:
          args: '-no-fail -fmt sarif -out gosec.sarif ./...'

      - name: Upload SAST Results
        uses: github/codeql-action/upload-sarif@v3.25.11
        with:
          sarif_file: gosec.sarif

  test-and-build:
    name: Test & Build Artifact
    needs: audit-and-lint
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4.1.7
        with:
          persist-credentials: false

      - name: Run Unit & Integration Tests
        run: |
          go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Build Binary with Hardening Flags
        env:
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags="-s -w -buildid=" -o bin/beacon-api ./cmd/beacon-api
```