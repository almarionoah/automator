# Hardened CI Pipeline Specification for Beacon API
**Author:** Prism Bishop  
**Department:** DevOps  
**Project:** Beacon API  
**Produced:** D16 05:45  
**Inputs used:** Business Document (Company Document)  
## Summary

A hardened, human-centered GitHub Actions pipeline for Beacon API, designed with an emphasis on developer joy and rigorous supply-chain integrity, strictly operationalizing the compliance and governance baselines outlined in the Company Document.

## Deliverable
```
name: Beacon API - Hardened CI Suite

# Aligned with security baselines and DX principles from Business Document: Company Document.
# The Company Document dictated least-privilege token permissions, mandatory SBOM
# generation, and automated SARIF security gate thresholds for SaaS and Face-to-Face operations.

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-validate:
    name: ✨ Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Runtime Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies (Deterministic)
        run: npm ci

      - name: Execute Code Formatting & Static Checks
        run: |
          echo "Validating code aesthetics and syntax..."
          npm run lint

  security-scan:
    name: 🛡️ Supply Chain & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy Dependency & Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Scan Artifacts to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
```