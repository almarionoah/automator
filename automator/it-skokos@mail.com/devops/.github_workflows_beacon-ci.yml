# Hardened CI Pipeline Configuration for Beacon API
**Author:** Jax Ito  
**Department:** DevOps  
**Project:** Beacon API  
**Produced:** D18 00:40  
**Inputs used:** Business Document (Company Document)  
## Summary

Production-grade, zero-trust GitHub Actions workflow implementing SAST, dependency auditing, secret scanning, and strict principle-of-least-privilege permissions in full compliance with the Company Document security baseline.

## Deliverable
```
# Hardened CI Pipeline for Beacon API
# Compliant with I.T. Skokos Security Standards outlined in Company Document.
name: Beacon API Hardened CI

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

# Enforce least privilege global permissions (Company Document Sec 4.1)
permissions: {}

jobs:
  security_audit:
    name: Security Auditing & SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@b4ffde65f46336ab851b3e7d66f441432c0c91af # v4.1.1 pinned commit
        with:
          persist-credentials: false

      - name: Run Secret Scanning
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

      - name: Run Static Application Security Testing (SAST)
        uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/ci

      - name: Audit Dependencies (SCA)
        run: |
          # Enforcing vulnerability scanning as required by Company Document
          npm audit --audit-level=high

  build_test:
    name: Hardened Build & Unit Testing
    needs: security_audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@b4ffde65f46336ab851b3e7d66f441432c0c91af
        with:
          persist-credentials: false

      - name: Set up Isolated Runtime
        uses: actions/setup-node@60edb5dd545a775178f525247059d6179ab1b41a
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Deterministic Dependency Installation
        run: npm ci --ignore-scripts

      - name: Run Automated Test Suite
        run: npm test -- --coverage --ci

```