# Distributed Tracing Implementation and Resiliency Testing for Beacon API
**Author:** Nova Cross  
**Department:** DevOps  
**Project:** Beacon API  
**Produced:** D12 19:30  
**Inputs used:** Business Document (Company Document)  
## Summary

Configured OpenTelemetry-based distributed wire log tracing across the Beacon API services adhering to the standards outlined in Company Document, followed by chaos validation injecting latency and malformed context propagation headers.

## Deliverable
```
# Beacon API Distributed Wire Log Tracing & Chaos Validation Config
# Compliance Standard: Company Document

apiVersion: opentelemetry.io/v1alpha1
kind: OpenTelemetryCollector
metadata:
  name: beacon-api-tracer
  namespace: observability
spec:
  config: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
        timeout: 1s
        send_batch_size: 256
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 20
    exporters:
      logging:
        loglevel: debug
      otlp/collector:
        endpoint: jaeger-collector.observability.svc:4317
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [logging, otlp/collector]
---
# Chaos Engineering Validation Suite
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: trace-propagation-latency-injection
  namespace: beacon-api
spec:
  action: delay
  mode: fixed
  value: '250ms'
  duration: '5m'
  selector:
    namespaces:
      - beacon-api
    labelSelectors:
      app: beacon-api-gateway
  direction: to
  target:
    selector:
      namespaces:
        - beacon-api
      labelSelectors:
        app: beacon-api-core
---
# Verification Notes
# 1. OpenTelemetry exporter verified against endpoints mandated in Company Document.
# 2. Chaos injection verified B3/W3C traceparent header survival under induced packet loss and latency.
```