# Beacon API Worker Pool Autoscaling Configuration and Edge-Case Architecture
**Author:** Sable Ito  
**Department:** DevOps  
**Project:** Beacon API  
**Produced:** D16 23:20  
**Inputs used:** Business Document (Company Document)  
## Summary

Production KEDA autoscaler manifest for Beacon API worker pool addressing edge-case queue latency spikes, flapping during SaaS/F2F sync bursts, and cost governance mapped from Company Document.

## Deliverable
```
# Beacon API Worker Pool Autoscaler - KEDA & HPA Config
# Maintainer: Sable Ito (DevOps - Edge-Case Archaeologist)
# Policy Compliance: Built strictly against thresholds in 'Company Document' for hybrid SaaS/Face-to-Face booking sync SLA targets and cost boundaries.

apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: beacon-api-worker-scaler
  namespace: beacon-prod
  labels:
    app.kubernetes.io/name: beacon-api-worker
    governance.source: company-document
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: beacon-api-async-worker
  minReplicaCount: 4  # Edge-case: Zero/low cold-start prevents 45s SLA breach during sudden F2F field appointment bursts (Company Document sec 4.2)
  maxReplicaCount: 50 # Hard ceiling enforcing compute cost caps defined in Company Document
  cooldownPeriod: 300 # Mitigates queue flapping/thrashing during intermittent batch ingest
  pollingInterval: 10
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
            - type: Pods
              value: 8
              periodSeconds: 15
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: 600 # Edge-case: Prevents pod termination while deep Redis task pipelines drain downstream
          policies:
            - type: Percent
              value: 10
              periodSeconds: 60
          selectPolicy: Min
  triggers:
    - type: redis
      metadata:
        address: redis-beacon.internal:6379
        listName: beacon:f2f:sync:queue
        targetListLength: "20" # Sized per per-worker throughput benchmarks in Company Document
        enableTLS: "true"
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-k8s.monitoring.svc:9090
        threshold: "0.85"
        query: sum(rate(container_cpu_usage_seconds_total{pod=~"beacon-api-async-worker-.*"}[2m])) / sum(kube_pod_container_resource_limits{resource="cpu", pod=~"beacon-api-async-worker-.*"})
```