**Project:** Beacon API  
**Produced:** D15 23:55  
**Inputs used:** Business Document (Company Document)  
## Summary

Configured cost-cutting autoscaling rules for the Beacon API worker pool using KEDA and Spot-affinity Kubernetes specs, referencing compute budget constraints from Business Document: Company Document.

## Deliverable
```
# Project: Beacon API - Worker Pool Autoscaling
# Engineer: Zed Van Dyk (DevOps)
# Policy Compliance: Configured in strict adherence to 'Business Document: Company Document' (Section 3: Cloud Compute Budget Limits & Spot Allocation Framework).

apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: beacon-api-worker-autoscaler
  namespace: beacon-prod
  labels:
    app: beacon-api-worker
    cost-profile: hyper-optimized
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: beacon-api-worker
  # Cost cutter optimization: scale-to-zero when queues are idle
  minReplicaCount: 0
  # Hard cap derived directly from 'Business Document: Company Document' monthly run-rate ceiling
  maxReplicaCount: 10
  cooldownPeriod: 60
  pollingInterval: 15
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 90
          policies:
          - type: Percent
            value: 50
            periodSeconds: 15
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
          - type: Pods
            value: 2
            periodSeconds: 15
  triggers:
  - type: redis
    metadata:
      addressFromEnv: REDIS_SERVICE_URL
      listName: beacon_task_queue
      listLength: "30"  # High batch threshold to maximize container CPU utilization before scaling
      activationListLength: "1"
---
# Tolerations ensuring pods schedule exclusively on Spot/Preemptible instances (60%+ savings per Business Document: Company Document)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beacon-api-worker
  namespace: beacon-prod
spec:
  template:
    spec:
      nodeSelector:
        node.kubernetes.io/instance-type: spot
      tolerations:
      - key: "spotInstance"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
```