# Beacon API Worker Pool Cost-Optimized Autoscaler Configuration
**Author:** Echo Adeyemi  
**Department:** DevOps  
**Project:** Beacon API  
**Produced:** D12 03:20  
**Inputs used:** Business Document (Company Document)  
## Summary

Configured aggressive downscaling and Spot-instance autoscaling for the Beacon API asynchronous worker pool using KEDA and Karpenter, calibrated against the budget ceilings and SLA thresholds detailed in the Business Document: Company Document.

## Deliverable
```
# Beacon API Worker Pool - Dynamic Autoscaling & Spot Optimization
# Designed by: Echo Adeyemi (DevOps - Cost Cutter)
# Governance Reference: Business Document: Company Document (Section 4: SLA Targets & Cloud Unit Economics)

apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: beacon-api-worker-scaledobject
  namespace: beacon-prod
  labels:
    app.kubernetes.io/part-of: beacon-api
    cost-center: saas-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: beacon-api-worker
  # Minimum replicas set to 0 during off-peak to eliminate idle run rate, per Business Document: Company Document
  minReplicaCount: 0
  maxReplicaCount: 40
  cooldownPeriod: 60 # Aggressive scale-down to curtail compute billing rapidly
  pollingInterval: 10
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 60
          policies:
          - type: Percent
            value: 50
            periodSeconds: 15
  triggers:
  - type: rabbitmq
    metadata:
      queueName: beacon_api_tasks
      targetQueueValue: "25" # High queue threshold to maximize container packing
      hostFromEnv: RABBITMQ_CONN_STRING
---
apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: beacon-worker-spot-pool
spec:
  template:
    spec:
      requirements:
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: ["spot"] # 100% Spot usage enforced to cut EC2 cost by ~70%
        - key: "kubernetes.io/arch"
          operator: In
          values: ["arm64"] # Graviton instance family for superior price-performance
      nodeClassRef:
        name: default
  disruption:
    consolidationPolicy: WhenUnderutilized
    consolidateAfter: 30s
    expireAfter: 720h
```