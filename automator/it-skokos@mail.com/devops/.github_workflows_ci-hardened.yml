# Beacon API - Hardened CI/CD Pipeline Configuration
**Author:** Pixel Nkosi  
**Department:** DevOps  
**Project:** Beacon API  
**Produced:** D15 13:25  
**Inputs used:** Business Document (Company Document)  
## Summary

Hardened GitHub Actions CI pipeline for Beacon API integrating SAST (CodeQL), container security scanning (Trivy), dependency auditing, and strict permission scoping according to guidelines in Business Document: Company Document.

## Deliverable
```
# Beacon API Hardened CI Pipeline
# Maintained by: Pixel Nkosi (DevOps)
# Compliance: Aligned with security baselines defined in Business Document: Company Document

name: Beacon API Hardened CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-gate:
    name: Quality & Vulnerability Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Strict Dependency Audit
        # Enforces zero critical/high CVEs as mandated by Business Document: Company Document
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

      - name: Execute Static Lint & Unit Tests
        run: |
          npm run lint
          npm run test:coverage

  sast-analysis:
    name: CodeQL SAST Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  container-vulnerability-scan:
    name: Container Build & Trivy Scan
    needs: [security-gate, sast-analysis]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Ephemeral Image
        run: docker build -t beacon-api:${{ github.sha }} .

      - name: Run Trivy Vulnerability Scanner
        # Applies container hardening controls from Business Document: Company Document
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'beacon-api:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload SARIF Security Findings
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
```