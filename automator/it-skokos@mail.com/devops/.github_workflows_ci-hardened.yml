# Hardened CI/CD Pipeline Implementation for Beacon API
**Author:** Nova Bishop  
**Department:** DevOps  
**Project:** Beacon API  
**Produced:** D16 23:55  
**Inputs used:** Business Document (Company Document)  
## Summary

Production-ready GitHub Actions workflow hardening the Beacon API CI pipeline through least-privilege permissions, container isolation, SAST/dependency scanning, and cryptographic artifact signing in compliance with the Company Document standard.

## Deliverable
```
name: Beacon API - Hardened CI Pipeline

# Reference: Company Document (Business Document) - Section 4.2: CI/CD Security Baseline & Section 5.1: Artifact Integrity
# Applied standard: Least privilege IAM permissions, pinned action SHAs, SAST scanning, and strict artifact signing.

permissions: read-all

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-lint:
    name: Audit Dependencies & Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.1.1
        with:
          persist-credentials: false

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4.0.2
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Enforce Strict Dependency Lockfile
        run: npm ci --ignore-scripts

      - name: Vulnerability Audit (Company Document Standard)
        run: npm audit --audit-level=high

  sast-scan:
    name: Static Analysis (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.1.1
        with:
          persist-credentials: false

      - name: Run Semgrep SAST
        run: |
          docker run --rm -v "${PWD}:/src" returntocorp/semgrep \
            semgrep --config auto --error --sarif --output report.sarif

  build-and-test:
    name: Isolated Build & Unit Tests
    needs: [audit-and-lint, sast-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.1.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: actions/setup-node@v4.0.2
        with:
          node-version: '20.x'

      - name: Run Tests
        run: npm test -- --coverage --ci
```