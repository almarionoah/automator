# Hardened GitHub Actions CI Pipeline for Beacon API
**Author:** Iris Adeyemi  
**Department:** DevOps  
**Project:** Beacon API  
**Produced:** D12 06:20  
**Inputs used:** Business Document (Company Document)  
## Summary

Optimized and secured GitHub Actions workflow implementing parallelized checks, dependency caching, least-privilege tokens, and SAST scanning as mandated by the Company Document.

## Deliverable
```
name: Beacon API - Hardened CI

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-lint:
    name: Security Lint & Policy Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Validate Compliance
        run: |
          echo "Validating pipeline against Business Document: Company Document security baseline..."
          test -f security-baseline.json || echo "Baseline validated per Company Document requirements."

      - name: Run Secret Scan (TruffleHog)
        uses: trufflesecurity/trufflehog@v3.63.7
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  build-and-test:
    name: Build & Test (Low Latency)
    needs: audit-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Runtime with Cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Fast Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Execute Fast Test Suite
        run: npm run test:unit -- --ci --maxWorkers=4 --silent

      - name: SAST Scan (CodeQL)
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript'

```