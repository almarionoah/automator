# Beacon API Hardened CI Pipeline Specification & Workflow
**Author:** Nova Bishop  
**Department:** DevOps  
**Project:** Beacon API  
**Produced:** D16 03:55  
**Inputs used:** Business Document (Company Document)  
## Summary

Hardened GitHub Actions CI pipeline configuration for Beacon API implementing least-privilege token permissions, static analysis, dependency auditing, and container signing in direct compliance with the standards defined in the Company Document.

## Deliverable
```
# =========================================================================
# Beacon API - Hardened Continuous Integration Pipeline
# Maintained by: Nova Bishop (DevOps)
# Reference Standard: Business Document: Company Document (Section 4: CI/CD Security Baseline)
# Documentation: See /docs/architecture/ci-security.md for rationale and architecture.
# =========================================================================

name: Beacon API - Hardened CI

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

# Principle of Least Privilege: Disable top-level default write permissions
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-lint:
    name: Security Linting & Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Required for SARIF upload per Company Document specs
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies (Frozen Lockfile)
        run: npm ci --ignore-scripts

      - name: Dependency Vulnerability Audit
        run: npm audit --audit-level=high

      - name: Run Static Application Security Testing (SAST)
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript'

  build-and-test:
    name: Build and Unit Testing
    needs: audit-and-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Tests with Coverage
        run: |
          npm ci --ignore-scripts
          npm test -- --coverage
```