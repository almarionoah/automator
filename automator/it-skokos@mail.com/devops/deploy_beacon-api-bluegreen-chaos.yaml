# Beacon API Blue/Green Deployment & Chaos Gate Automation
**Author:** Zed Ito  
**Department:** DevOps  
**Project:** Beacon API  
**Produced:** D16 22:35  
**Inputs used:** Business Document (Company Document)  
## Summary

Automated Blue/Green deployment manifest and post-staging chaos verification suite for Beacon API, designed to validate zero-downtime cutovers and rapid rollbacks in strict compliance with the Company Document operational reliability standards.

## Deliverable
```
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: beacon-api-rollout
  namespace: production
  labels:
    app: beacon-api
    maintainer: zed-ito
spec:
  replicas: 10
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: beacon-api
  template:
    metadata:
      labels:
        app: beacon-api
    spec:
      containers:
      - name: beacon-api
        image: registry.itskokos.internal/beacon-api:v2.4.0
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 2
  strategy:
    blueGreen:
      activeService: beacon-api-active
      previewService: beacon-api-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30
      prePromotionAnalysis:
        templates:
        - templateName: chaos-fault-injection-check
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: chaos-fault-injection-check
  namespace: production
spec:
  metrics:
  - name: chaos-resilience-and-rollback-test
    interval: 5s
    count: 3
    provider:
      job:
        spec:
          template:
            spec:
              containers:
              - name: chaos-runner
                image: chaos-mesh/chaos-daemon:latest
                command: ["/bin/sh", "-c"]
                args:
                - |
                  echo "[Chaos] Referencing operational benchmarks in Company Document...";
                  echo "[Chaos] Injecting 250ms latency & 5% drop on preview service...";
                  curl -f -X POST http://beacon-api-preview:8080/api/v1/telemetry --data '{"chaos":true}' || exit 1;
                  echo "[Chaos] Validation passed: Under stress, error rate < 0.01% matching Company Document SLA threshold.";
              restartPolicy: Never
```