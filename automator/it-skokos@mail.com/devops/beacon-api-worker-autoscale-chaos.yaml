## Summary

Autoscaling configuration and chaos injection test suite for the Beacon API worker pool, calibrated against SLA metrics in Business Document: Company Document.

## Deliverable
```
# Beacon API Worker Pool Autoscale & Chaos Injection Suite
# Author: Halo Cross (DevOps / Chaos Tester)
# Platform: I.T. Skokos SaaS & Face to Face Services
# Resource Usage: Business Document: Company Document was referenced to extract SLA thresholds (P99 processing latency < 400ms) and establish blast-radius containment limits for concurrent face-to-face booking ingestion.

apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: beacon-worker-autoscaler
  namespace: beacon-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: beacon-api-worker
  minReplicaCount: 4
  maxReplicaCount: 48
  cooldownPeriod: 45
  pollingInterval: 10
  triggers:
    - type: rabbitmq
      metadata:
        queueName: beacon.f2f.sync.v1
        mode: QueueLength
        value: "150"
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 120
          policies:
            - type: Percent
              value: 20
              periodSeconds: 30
---
apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: beacon-autoscale-resilience-drill
  namespace: chaos-testing
spec:
  entry: autoscale-stress-kill
  templates:
    - name: autoscale-stress-kill
      templateType: Parallel
      children:
        - pod-kill-during-burst
        - worker-cpu-saturation
    - name: pod-kill-during-burst
      templateType: PodChaos
      podChaos:
        action: pod-kill
        mode: fixed-percent
        value: "25%"
        selector:
          namespaces: ["beacon-api"]
          labelSelectors: {"app.kubernetes.io/name": "beacon-api-worker"}
        duration: "6m"
    - name: worker-cpu-saturation
      templateType: StressChaos
      stressChaos:
        selector:
          namespaces: ["beacon-api"]
          labelSelectors: {"app.kubernetes.io/name": "beacon-api-worker"}
        stressors:
          cpu: { workers: 2, load: 85 }
        duration: "6m"
```