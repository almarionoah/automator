# Beacon API Blue/Green Deployment Specification & Argo Rollout Manifest
**Author:** Onyx Nkosi  
**Department:** DevOps  
**Project:** Beacon API  
**Produced:** D16 05:50  
**Inputs used:** Business Document (Company Document)  
## Summary

Production Blue/Green deployment configuration and operational documentation for Beacon API, implementing zero-downtime cutover and preview testing in compliance with Business Document: Company Document.

## Deliverable
```
# ==============================================================================
# Project: Beacon API - Blue/Green Deployment Architecture
# Maintainer: Onyx Nkosi (DevOps) | I.T. Skokos SaaS Platform
# Reference: Business Document: Company Document
#
# IMPLEMENTATION NOTE:
# In accordance with standard operational compliance codified in 'Business Document:
# Company Document', this manifest implements zero-downtime blue/green releases.
# It ensures automated preview verification, traffic isolation, and instant rollback
# capability prior to shifting production traffic.
# ==============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: beacon-api-rollout
  namespace: production
  labels:
    app.kubernetes.io/name: beacon-api
    app.kubernetes.io/part-of: skokos-saas
spec:
  replicas: 6
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: beacon-api
  template:
    metadata:
      labels:
        app: beacon-api
    spec:
      containers:
      - name: beacon-api
        image: registry.itskokos.internal/beacon-api:v2.4.0
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          limits:
            cpu: "1000m"
            memory: "1Gi"
          requests:
            cpu: "250m"
            memory: "512Mi"
  strategy:
    blueGreen:
      activeService: beacon-api-active-svc
      previewService: beacon-api-preview-svc
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 300
      prePromotionAnalysis:
        templates:
        - templateName: beacon-smoke-test-analysis
---
apiVersion: v1
kind: Service
metadata:
  name: beacon-api-active-svc
  namespace: production
spec:
  selector:
    app: beacon-api
  ports:
  - name: http
    port: 80
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: beacon-api-preview-svc
  namespace: production
spec:
  selector:
    app: beacon-api
  ports:
  - name: http
    port: 80
    targetPort: 8080
```