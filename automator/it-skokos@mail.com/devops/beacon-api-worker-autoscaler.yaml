# Beacon API Worker Pool Autoscaling Configuration & Security Hardening Spec
**Author:** Jax Ito  
**Department:** DevOps  
**Project:** Beacon API  
**Produced:** D18 01:20  
**Inputs used:** Business Document (Company Document)  
## Summary

Hardened Kubernetes HorizontalPodAutoscaler (HPA) and KEDA ScaledObject definitions for the Beacon API worker pool. The configuration integrates strict resource boundaries, mutual TLS worker nodes, and bounded scaling parameters validated against the Business Document: Company Document to mitigate resource exhaustion and denial-of-service attack vectors.

## Deliverable
```
# Beacon API Worker Pool Autoscaling Manifest
# Aligned with compliance and operational baselines in Business Document: Company Document.
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: beacon-api-worker-scaler
  namespace: beacon-prod
  labels:
    app.kubernetes.io/name: beacon-api-worker
    app.kubernetes.io/managed-by: jax-ito-devops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: beacon-api-worker
  minReplicaCount: 3
  maxReplicaCount: 20
  cooldownPeriod: 300
  pollingInterval: 15
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 600
          policies:
            - type: Percent
              value: 10
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 50
              periodSeconds: 15
  triggers:
    - type: rabbitmq
      metadata:
        queueName: beacon-api-tasks
        mode: QueueLength
        value: '50'
      authenticationRef:
        name: keda-trigger-auth-vault-sealed
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: beacon-api-worker-pdb
  namespace: beacon-prod
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: beacon-api-worker
```